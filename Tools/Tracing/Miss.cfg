# What the kernel did with a commit gyro handed over on time.
#
# gyro's own trace ends at `drmModeAtomicCommit` and resumes at the flip event. Everything that can
# lose a refresh without gyro being late lives in that gap: a fence the display engine is still
# waiting on, a plane update the driver deferred, a commit thread that never got scheduled. A frame
# that missed looks identical to one that was simply issued late unless this gap is filled in.
#
# The clock is boot, which is what gyro's ClockSnapshot pairs its own timebase against — and gyro
# declares no `primary_trace_clock`, deliberately, so the two files compose. `cat` them in either
# order and every row lands on one timeline.
#
# This found Display WA #1198 once: i915 spending a vblank between an FBC disable and a plane update,
# on the commit where a window's first promotion rewrites the primary plane's framebuffer. The event
# set is not specific to that — it is the four ways the gap can eat a frame, one group each.
buffers: {
  size_kb: 262144
  fill_policy: RING_BUFFER
}

data_sources: {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      # ---- The direct answer. i915's atomic tail busy-waits to land the
      # register write inside the safe window before vblank ("vblank evade").
      # These three carry the pipe, the frame number and the scanline, so a
      # commit that started for frame N and ended reporting N+1 is the miss,
      # written down by the driver itself.
      ftrace_events: "i915/intel_pipe_update_start"
      ftrace_events: "i915/intel_pipe_update_vblank_evaded"
      ftrace_events: "i915/intel_pipe_update_end"

      # ---- The hypothesis under test. Frame/Assign.h hands a promoted layer
      # SyncPoint::Immediate(), so gyro's IN_FENCE is already signalled — but a
      # promoted buffer is necessarily a dmabuf (Drm/Scanout.cpp refuses a
      # mapped one), and the kernel still waits on its reservation fence. A
      # wait_start/wait_end pair spanning the missed vblank is the answer.
      ftrace_events: "dma_fence/dma_fence_init"
      ftrace_events: "dma_fence/dma_fence_emit"
      ftrace_events: "dma_fence/dma_fence_wait_start"
      ftrace_events: "dma_fence/dma_fence_wait_end"
      ftrace_events: "dma_fence/dma_fence_signaled"

      # ---- The vblank grid, cross-checkable against gyro's own flip marks.
      ftrace_events: "drm/drm_vblank_event"
      ftrace_events: "drm/drm_vblank_event_queued"
      ftrace_events: "drm/drm_vblank_event_delivered"

      # ---- Rules out the alternative: that gyro's SCHED_FIFO commit thread
      # simply was not scheduled. Without this, "the kernel was slow" and "the
      # thread never ran" look identical.
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "sched/sched_wakeup_new"
      ftrace_events: "sched/sched_process_exec"

      # ---- The client's own GPU work, which is what the fence is waiting on.
      # Several of these sit behind CONFIG_DRM_I915_LOW_LEVEL_TRACEPOINTS and
      # may be absent; Perfetto skips an event it cannot find rather than
      # failing the capture.
      ftrace_events: "i915/i915_request_add"
      ftrace_events: "i915/i915_request_queue"
      ftrace_events: "i915/i915_request_in"
      ftrace_events: "i915/i915_request_out"
      ftrace_events: "i915/i915_request_retire"

      # Names for the pids above, so a row says gnome-calculator rather than 4127.
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"

      buffer_size_kb: 32768
      drain_period_ms: 250
    }
  }
}

# Process names and cmdlines, so the commit thread is identifiable by name.
data_sources: {
  config {
    name: "linux.process_stats"
    target_buffer: 0
    process_stats_config {
      scan_all_processes_on_start: true
    }
  }
}

duration_ms: 12000
