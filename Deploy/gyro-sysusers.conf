# The uid gyro runs as, and the group its devices are granted to.
#
# Decision 22 has gyro as a dedicated unprivileged user reaching its devices through udev rules
# rather than through capabilities, so this file and the three rules beside it are the whole of what
# gives a boot service a display and a keyboard. Neither half works without the other: the rules name
# this group, and a rule applied before the group exists grants the devices to nobody.
#
# **A system user with no login and no shell.** gyro never authenticates anyone — PAM runs in the
# login agent, which is a different program at a different privilege (Docs/Architecture.md#the-login-agent)
# — so there is nothing this account is for except owning a process and a state directory.
#
# `/var/lib/gyro` is the working directory `gyro.service` sets, and the reason it is a real directory
# rather than `-` is that `SIGUSR1` writes a trace into the working directory at any time.
#
# A person who wants to run gyro from their own shell on a development machine joins the group:
#
#     sudo usermod -aG gyro $USER
#
# which is how eldrid and coachz have both been set up, and is why a dev run reaches every device
# without this user existing at all.

u  gyro  -  "gyro compositor"  /var/lib/gyro  /usr/sbin/nologin
